name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # allow manual runs from the Actions tab

# Cancel an older run of the same branch when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30     # SD-103 thêm ~12 phút (1 worker); người dùng chọn phương án B 2026-11-26
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
        cache: npm                       # reuse downloaded npm packages

    - name: Install dependencies
      run: npm ci

    # Cache the Chromium binary, keyed by the installed Playwright version
    - name: Get Playwright version
      id: pw
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright browsers
      id: pw-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

    # Only Chromium is used (see playwright.config.ts → projects)
    - name: Install Chromium + system deps (cache miss)
      if: steps.pw-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium
    - name: Install system deps only (cache hit)
      if: steps.pw-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps chromium

    # Playwright runs TypeScript WITHOUT type checking: a typo (e.g. an undefined variable)
    # only shows at run time, and inside a test.fail() test it is counted as "the bug". Catch it here first.
    - name: Type check
      run: npm run typecheck

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
